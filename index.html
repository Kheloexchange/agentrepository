<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wire &mdash; Trending Topics</title>
  <meta name="description" content="Live trending topics, pulled straight from the source. No API keys, no backend, no build step." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanline" aria-hidden="true"></div>

  <header class="masthead">
    <div class="masthead-row">
      <div class="brand">
        <span class="brand-mark">WIRE</span>
        <span class="brand-sub">trending topics, straight from the source</span>
      </div>
      <div class="masthead-meta">
        <span id="clock" class="clock">--:--:--</span>
        <button id="refreshBtn" class="refresh-btn" type="button">
          <span class="refresh-icon" aria-hidden="true">&#8635;</span>
          Refresh
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Trending sources">
      <!-- tabs injected by script.js -->
    </nav>
  </header>

  <main id="main">
    <!-- sections injected by script.js -->
  </main>

  <footer class="site-footer">
    <p>
      Every headline below is fetched <strong>directly from the source's own free, public,
      CORS-enabled endpoint</strong>, right in your browser &mdash; no API keys, no proxy service,
      no backend, no build step. Open <code>script.js</code> to see exactly what's requested.
    </p>
  </footer>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-rank"></div>
      <div class="card-body">
        <a class="card-title" target="_blank" rel="noopener noreferrer"></a>
        <div class="card-meta">
          <span class="card-stat"></span>
          <span class="card-dot" aria-hidden="true">&middot;</span>
          <span class="card-time"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
